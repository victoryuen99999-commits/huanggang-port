name: 更新皇崗口岸資料

on:
  schedule:
    # 只負責「接力」：每 15 分鐘排一次，如已有 job 在跑就自動排隊，
    # job 一結束即接手，避免出現空窗。真正刷新由 job 內部 loop 每 10 分鐘做。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh          # 同時只准一個 job；新一輪會排隊接住跑
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 快取無頭瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1

      - name: 安裝 Playwright（深圳口岸辦需要執行 JS 才能取數）
        run: |
          python -m pip install --quiet playwright opencc-python-reimplemented
          python -m playwright install chromium
          python -m playwright install-deps chromium || true

      # 公開 repo 的 Actions 分鐘數不限，所以可以長時間連續刷新。
      # 每 6 分鐘一次（=10 次/小時，剛好 GitHub Pages 每小時建置上限）。
      - name: 連續刷新（每 6 分鐘一次，共 9 次）
        run: |
          git config user.name  "hgp-bot"
          git config user.email "hgp-bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "::group::第 $i 次刷新 $(date -u '+%H:%M UTC')"
            python refresh.py
            python events_refresh.py || echo "活動資料抓取失敗，保留上次快照"
            if [ "$i" = "1" ]; then
              python sz_refresh.py || echo "深圳側抓取失敗，保留上次快照"
            fi
            if [ -n "$(git status --porcelain data.js data.json history.js sz.js events.js)" ]; then
              git add data.js data.json history.js sz.js events.js
              git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
              git pull --rebase -X ours origin main || true
              git push || echo "push 失敗，下一輪再試"
            else
              echo "沒有變更"
            fi
            echo "::endgroup::"
            if [ "$i" -lt 9 ]; then sleep 360; fi
          done

