name: 更新皇崗口岸資料

on:
  schedule:
    # 每 5 分鐘（GitHub 最短間隔）。大量排程會被 throttle，實際仍可能延遲，
    # 所以同時有 local_refresh.py 在本機補時。
    - cron: "*/5 * * * *"
  workflow_dispatch:            # 亦可手動觸發

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取入境處輪候 + 天氣
        run: python refresh.py

      - name: 有變更才提交
        run: |
          git config user.name  "hgp-bot"
          git config user.email "hgp-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.js data.json)" ]; then
            git add data.js data.json
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "沒有變更"
          fi
